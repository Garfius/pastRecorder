; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
board_build.filesystem_size = 512k
lib_deps =
	https://github.com/Garfius/xModemArdiuno.git#0548376a37b06e60ce16388154ea6fd63b5028dc
  https://github.com/pschatzmann/arduino-audio-tools/archive/a82232c40a5a17ce925317ff9db5f297f25ef36a.zip
  https://github.com/pschatzmann/codec-shine/archive/refs/heads/main.zip

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git #
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m

[env:zeroTiny]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
debug_tool = cmsis-dap
board_build.filesystem_size = 1m
build_flags =
  -Drp2040_zero

[env:Rp2350ZeroDebug]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_zero
framework = arduino
board_build.core = earlephilhower
debug_tool = cmsis-dap
board_build.filesystem_size = 1m
build_flags =
  -Drp2350_zero

[platformio]
default_envs = Rp2350ZeroDebug
